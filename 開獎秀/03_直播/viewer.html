<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>開獎秀 — 直播 Viewer</title>
    <style>
      :root { color-scheme: dark; font-family: sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-width: 1100px; color: #f3f8f7; background: #080d0f; }
      main { display: grid; min-height: 100vh; grid-template-columns: 300px minmax(0, 1fr); }
      aside { padding: 24px; border-right: 1px solid rgb(255 255 255 / 12%); }
      section { min-width: 0; padding: 32px; }
      h1, h2, p { margin-top: 0; }
      h1 { font-size: 20px; } h2 { margin: 22px 0 10px; font-size: 16px; }
      .field, .color-field { display: grid; gap: 6px; margin-top: 14px; font-size: 13px; }
      .head { display: flex; justify-content: space-between; gap: 8px; }
      .counter, #status { color: rgb(235 242 241 / 76%); font-size: 12px; }
      input[type="text"], textarea { width: 100%; padding: 8px; color: inherit; border: 1px solid rgb(255 255 255 / 18%); border-radius: 5px; background: rgb(0 0 0 / 24%); font: inherit; }
      textarea { min-height: 76px; resize: vertical; }
      .color-field { grid-template-columns: 1fr auto; align-items: center; }
      .logo-mode { display: grid; gap: 6px; margin-top: 14px; font-size: 13px; }
      select { padding: 8px; color: inherit; border: 1px solid rgb(255 255 255 / 18%); border-radius: 5px; background: rgb(0 0 0 / 24%); }
      canvas { display: block; width: min(100%, var(--live-preview-max-width, 1125px)); height: auto; }
      .preview-wrap { position: relative; width: min(100%, var(--live-preview-max-width, 1125px)); }
      #overlay { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
      button { margin-top: 14px; padding: 9px 12px; border: 0; border-radius: 5px; color: white; background: #ee4d2d; cursor: pointer; }
      input:focus-visible, button:focus-visible { outline: 2px solid #ee4d2d; outline-offset: 2px; }
      .live-06-selection-host { position: relative; }
      .live-06-selection-layer, .live-06-interaction-layer { position: absolute; inset: 0; }
      .live-06-selection-layer { z-index: 2; pointer-events: none; }
      .live-06-interaction-layer { z-index: 3; cursor: text; touch-action: none; }
      .live-06-selection-mark { position: absolute; border-radius: 3px; background: rgb(255 226 70 / 46%); box-shadow: inset 0 0 0 1px rgb(255 226 70 / 76%); }
      .live-06-selection-action { position: absolute; z-index: 4; margin: 0; padding: 6px 9px; border: 0; border-radius: 5px; color: #182020; background: #ffe246; box-shadow: 0 2px 8px rgb(0 0 0 / 35%); cursor: pointer; font: inherit; font-size: 12px; font-weight: 700; white-space: nowrap; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main data-spx-lottery-show-live-01-viewer="true">
      <aside>
        <h1 id="viewer-title">直播 Viewer</h1>
        <p id="error" role="alert"></p>
        <div id="editor" hidden>
          <h2>Style</h2>
          <label><input type="radio" name="style" value="smart-locker"> 智取櫃</label>
          <label><input type="radio" name="style" value="store"> 門市</label>
          <h2>文字</h2><div id="text-fields"></div>
          <h2>Logo</h2><label class="logo-mode">Logo 模式<select id="logo-mode"><option value="auto">Auto</option><option value="orange">橘色</option><option value="white">白色</option></select></label>
          <h2>顏色</h2><div id="color-fields"></div>
          <label><input id="overlay-toggle" type="checkbox"> 顯示對位圖</label>
          <label class="field">對位圖透明度<input id="overlay-opacity" type="range" min="0" max="100" value="50"></label>
          <button id="download" type="button">下載 JPG</button>
          <p id="status" role="status" aria-live="polite"></p>
        </div>
      </aside>
      <section><div class="preview-wrap" id="preview-wrap" hidden><canvas id="preview" width="1125" height="360"></canvas><img id="overlay" alt="對位圖" hidden></div></section>
    </main>
    <script type="module">
      import { LIVE_01_LAYOUT, getLive01Style } from "./js/layout-01-live-lpbn.js";
      import { LIVE_02_LAYOUT, getLive02Style } from "./js/layout-02-live-system-cta.js";
      import { LIVE_03_LAYOUT, getLive03Style } from "./js/layout-03-live-thumbnail-specified-day.js";
      import { LIVE_04_LAYOUT, getLive04Style } from "./js/layout-04-live-msbn-kv.js";
      import { LIVE_05_LAYOUT, getLive05Style } from "./js/layout-05-live-msbn-case-card.js";
      import { LIVE_06_LAYOUT, getLive06Style } from "./js/layout-06-live-opening-card.js";
      import { mountLive06TextSelection } from "./js/live-06-text-selection.js";
      import { canvasToJpegBlob, clearTextRangesForField, createInitialState, renderLiveToCanvas, validateLiveTextState } from "./js/renderer-01.js";

      const params = new URLSearchParams(location.search);
      const layoutId = params.get("layout");
      const initialStyleId = params.get("style");
      const layouts = new Map([
        [LIVE_01_LAYOUT.id, [LIVE_01_LAYOUT, getLive01Style]],
        [LIVE_02_LAYOUT.id, [LIVE_02_LAYOUT, getLive02Style]],
        [LIVE_03_LAYOUT.id, [LIVE_03_LAYOUT, getLive03Style]],
        [LIVE_04_LAYOUT.id, [LIVE_04_LAYOUT, getLive04Style]],
        [LIVE_05_LAYOUT.id, [LIVE_05_LAYOUT, getLive05Style]],
        [LIVE_06_LAYOUT.id, [LIVE_06_LAYOUT, getLive06Style]]
      ]);
      const error = document.querySelector("#error");
      const editor = document.querySelector("#editor");
      const wrap = document.querySelector("#preview-wrap");
      const canvas = document.querySelector("#preview");
      const overlay = document.querySelector("#overlay");
      const status = document.querySelector("#status");
      const countTextUnits = (value) => [...String(value ?? "")].reduce((sum, ch) => sum + (/\p{Script=Han}/u.test(ch) ? 1 : 0.5), 0);
      const formatUnits = (value) => Number.isInteger(value) ? String(value) : value.toFixed(1);
      const getColorFields = (layout) => layout.colorFields ?? [
        { id: "background", label: "背景色" },
        { id: "titleTime", label: "主標＋時間" },
        { id: "subtitle", label: "副標" },
        { id: "warning", label: "警語" }
      ];

      const layoutEntry = layouts.get(layoutId);
      if (!layoutEntry || !layoutEntry[1](initialStyleId)) {
        error.textContent = "找不到指定的直播 layout 或 style。";
      } else {
        const [activeLayout, getStyle] = layoutEntry;
        editor.hidden = false; wrap.hidden = false;
        let styleId = initialStyleId;
        let state = createInitialState(styleId, activeLayout);
        canvas.width = activeLayout.canvas.width;
        canvas.height = activeLayout.canvas.height;
        wrap.style.setProperty("--live-preview-max-width", activeLayout.id === "04" ? "1200px" : activeLayout.id === "05" ? "1920px" : activeLayout.id === "06" ? "1080px" : "1125px");
        const logoMode = document.querySelector("#logo-mode");
        const styleInputs = [...document.querySelectorAll("input[name=style]")];
        const textControls = new Map();
        const colorControls = new Map();
        let cleanupSelection = () => {};
        document.querySelector("#viewer-title").textContent = `直播 ${activeLayout.id}：${activeLayout.name}`;
        styleInputs.find((input) => input.value === styleId).checked = true;
        overlay.src = activeLayout.alignmentOverlaySrc.href; overlay.style.opacity = "0.5";

        function syncUrl() {
          const nextUrl = new URL(location.href);
          nextUrl.searchParams.set("style", styleId);
          history.replaceState(null, "", nextUrl);
        }

        async function render() {
          try {
            const rendered = await renderLiveToCanvas({ styleId, state, layout: activeLayout });
            canvas.getContext("2d").clearRect(0, 0, canvas.width, canvas.height); canvas.getContext("2d").drawImage(rendered, 0, 0);
            status.textContent = `${activeLayout.name} · ${styleId}`;
          } catch (renderError) { wrap.hidden = true; error.textContent = renderError instanceof Error ? renderError.message : "直播 render 失敗。"; }
        }

        function mountSelection() {
          cleanupSelection(); cleanupSelection = () => {};
          if (activeLayout.id === "06") {
            cleanupSelection = mountLive06TextSelection({
              container: wrap,
              canvas,
              layout: activeLayout,
              getState: () => state,
              render
            });
          }
        }

        function switchStyle(nextStyleId) {
          if (!getStyle(nextStyleId) || nextStyleId === styleId) return;
          const previousState = state;
          styleId = nextStyleId;
          state = createInitialState(styleId, activeLayout);
          if (activeLayout.id === "06") {
            state.text = structuredClone(previousState.text);
            state.textRanges = structuredClone(previousState.textRanges);
            state.logoMode = previousState.logoMode;
          }
          textControls.forEach((control) => control.reset());
          colorControls.forEach((control) => control.reset());
          logoMode.value = state.logoMode;
          styleInputs.forEach((input) => { input.checked = input.value === styleId; });
          syncUrl();
          mountSelection();
          render();
        }

        styleInputs.forEach((input) => input.addEventListener("change", () => {
          if (input.checked) switchStyle(input.value);
        }));

        const readField = (field) => field.group ? state.text.steps[field.group][field.id] : state.text[field.id];
        const writeField = (field, value) => { if (field.group) state.text.steps[field.group][field.id] = value; else state.text[field.id] = value; };
        const mountTextField = (field, container, controlKey = field.id, onCommitted = () => {}) => {
          const label = document.createElement("label"); label.className = "field";
          const head = document.createElement("span"); head.className = "head"; const title = document.createElement("span"); title.textContent = field.label; const counter = document.createElement("span"); counter.className = "counter"; head.append(title, counter);
          const input = field.multiline ? document.createElement("textarea") : document.createElement("input");
          if (!field.multiline) input.type = "text";
          if (field.multiline) { input.rows = field.maxLines; input.spellcheck = false; }
          input.value = readField(field); let lastValid = input.value; let composing = false;
          const exceedsLimit = (value) => field.multiline
            ? String(value).split("\n").length > field.maxLines || String(value).split("\n").some((line) => countTextUnits(line) > field.maxCharsPerLine)
            : countTextUnits(value) > field.limit;
          const paint = () => {
            if (field.multiline) {
              const lines = String(input.value).split("\n");
              counter.textContent = `${lines.length}/${field.maxLines} 行 · ${lines.map(countTextUnits).join("/")} / ${field.maxCharsPerLine}`;
            } else counter.textContent = `${formatUnits(countTextUnits(input.value))} / ${field.limit}`;
          };
          const rollback = () => { input.value = lastValid; paint(); };
          const commit = () => {
            const previous = lastValid;
            const nextValue = input.value;
            writeField(field, nextValue);
            try { validateLiveTextState(activeLayout, state); } catch { writeField(field, previous); rollback(); return; }
            if (nextValue !== previous && activeLayout.id === "06") clearTextRangesForField(state, field);
            lastValid = nextValue; paint(); onCommitted(); render();
          };
          input.addEventListener("compositionstart", () => { composing = true; });
          input.addEventListener("compositionend", () => { composing = false; if (exceedsLimit(input.value)) rollback(); else commit(); });
          input.addEventListener("input", () => {
            if (composing) { writeField(field, input.value); paint(); if (!field.multiline) render(); }
            else if (exceedsLimit(input.value)) rollback();
            else commit();
          });
          textControls.set(controlKey, { reset: () => { input.value = readField(field); lastValid = input.value; composing = false; paint(); } });
          paint(); label.append(head, input); container.append(label);
        };
        activeLayout.textOrder.forEach((id) => mountTextField(activeLayout.text[id], document.querySelector("#text-fields")));
        if (activeLayout.stepGroups) {
          activeLayout.stepGroups.forEach((group) => {
            const details = document.createElement("details"); details.className = "live-05-step-group";
            const summary = document.createElement("summary"); const title = document.createElement("span"); title.textContent = group.label; const summaryText = document.createElement("span"); summaryText.className = "live-05-step-summary";
            const updateSummary = () => { const values = group.rows.map((row) => readField(row)).filter(Boolean); summaryText.textContent = values.length ? values.join("／") : "尚未填寫"; };
            summary.append(title, summaryText); details.append(summary);
            group.rows.forEach((row) => mountTextField(row, details, `${group.id}.${row.id}`, updateSummary));
            details.addEventListener("toggle", updateSummary); updateSummary(); document.querySelector("#text-fields").append(details);
          });
        }

        logoMode.addEventListener("change", () => { state.logoMode = logoMode.value; render(); });

        getColorFields(activeLayout).forEach(({ label: labelText, id: key }) => {
          const label = document.createElement("label"); label.className = "color-field"; label.append(document.createTextNode(labelText));
          const input = document.createElement("input"); input.type = "color"; input.value = state.colors[key]; input.addEventListener("input", () => { state.colors[key] = input.value; render(); });
          colorControls.set(key, { reset: () => { input.value = state.colors[key]; } });
          label.append(input); document.querySelector("#color-fields").append(label);
        });
        document.querySelector("#overlay-toggle").addEventListener("change", (event) => { overlay.hidden = !event.target.checked; });
        document.querySelector("#overlay-opacity").addEventListener("input", (event) => { overlay.style.opacity = String(Number(event.target.value) / 100); });
        document.querySelector("#download").addEventListener("click", async () => {
          const outputName = activeLayout.outputName ?? (activeLayout.id === "02" ? "直播大廳LPBN_系統CTA.jpg" : "直播大廳LPBN_立即看.jpg");
          const blob = await canvasToJpegBlob(await renderLiveToCanvas({ styleId, state: structuredClone(state), layout: activeLayout }));
          const url = URL.createObjectURL(blob); const anchor = document.createElement("a"); anchor.href = url; anchor.download = outputName; anchor.click(); setTimeout(() => URL.revokeObjectURL(url), 0);
        });
        mountSelection();
        render();
      }
    </script>
  </body>
</html>
